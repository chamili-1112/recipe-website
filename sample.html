<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    #hoverText {
      padding: 10px;
      color: black;
    }
    #hoverText:hover {
      color: red;
    }
  </style>
</head>
<body>

<div id="hoverText" onmouseover="hoverAlert()">Hover over this text!</div>

<script>
  function hoverAlert() {
    document.getElementById('hoverText').style.color="red";
    alert("You hovered over the text!");
  }
</script>

</body>
</html>
